<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Joel Cheah | Full Stack Engineer, Cloud &amp; Platform</title>
  <desc id="desc">From interfaces to infrastructure. An animated route connects React interfaces, Node.js APIs, and AWS infrastructure. Malaysia and United Kingdom.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#20364c" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="halo">
      <stop stop-color="#123c49" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" x2="1">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="478" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .signal { animation: travel 9s linear infinite; }
    .beacon { animation: breathe 4s ease-in-out infinite; }
    .cursor { animation: blink 1.8s steps(2, end) infinite; }
    @keyframes travel { to { stroke-dashoffset: -640; } }
    @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .signal, .beacon, .cursor { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="480" fill="#0b1220"/>
    <rect x="620" width="580" height="480" fill="url(#grid)"/>
    <ellipse cx="956" cy="180" rx="340" ry="290" fill="url(#halo)"/>
    <path d="M620 0V480" stroke="#29425a" stroke-dasharray="3 9" opacity=".55"/>

    <!-- Identity -->
    <rect x="48" y="40" width="111" height="28" rx="14" fill="#15263a" stroke="#29425a"/>
    <circle cx="65" cy="54" r="4" fill="#5eead4"/>
    <text class="mono" x="77" y="59" fill="#f0f5fb" font-size="12" letter-spacing="1.5">JOELCUY</text>
    <text class="mono" x="48" y="110" fill="#a5b6cb" font-size="13" letter-spacing="2.1">FULL STACK / CLOUD &amp; PLATFORM</text>
    <text class="sans" x="44" y="192" fill="#f0f5fb" font-size="75" font-weight="750" letter-spacing="-3.5">Joel Cheah<tspan fill="#5eead4">.</tspan></text>
    <text class="sans" x="48" y="247" fill="#f0f5fb" font-size="29" font-weight="600" letter-spacing="-.7">From interfaces</text>
    <text class="sans" x="48" y="286" fill="#f0f5fb" font-size="29" font-weight="600" letter-spacing="-.7">to infrastructure.</text>
    <text class="sans" x="48" y="330" fill="#a5b6cb" font-size="17">Building useful products. Making operations flow.</text>
    <path d="M48 362H565" stroke="#29425a"/>
    <text class="mono" x="48" y="395" fill="#5eead4" font-size="13">01 / PRODUCT</text>
    <text class="mono" x="225" y="395" fill="#5eead4" font-size="13">02 / PLATFORM</text>
    <text class="mono" x="415" y="395" fill="#5eead4" font-size="13">03 / CLOUD</text>
    <text class="mono" x="48" y="440" fill="#a5b6cb" font-size="12" letter-spacing="1">MALAYSIA ↔ UNITED KINGDOM</text>

    <!-- A small deployment console -->
    <rect x="668" y="46" width="484" height="132" rx="12" fill="#050a12" opacity=".12" transform="translate(0 6)"/>
    <rect x="668" y="46" width="484" height="132" rx="12" fill="#101d2e" stroke="#29425a"/>
    <path d="M668 80H1152" stroke="#29425a"/>
    <circle cx="688" cy="63" r="4" fill="#ffb86b"/>
    <circle cx="704" cy="63" r="4" fill="#a5b6cb" opacity=".6"/>
    <circle cx="720" cy="63" r="4" fill="#5eead4"/>
    <text class="mono" x="1132" y="67" text-anchor="end" fill="#a5b6cb" font-size="11">joel / build.log</text>
    <text class="mono" x="690" y="107" fill="#a5b6cb" font-size="13"><tspan fill="#5eead4">$</tspan> ship --from idea --to production</text>
    <text class="mono" x="690" y="132" fill="#5eead4" font-size="12">✓ interfaces   ✓ APIs   ✓ infrastructure</text>
    <text class="mono" x="690" y="157" fill="#a5b6cb" font-size="12">one engineer, across the stack</text>
    <rect class="cursor" x="928" y="146" width="7" height="13" rx="1" fill="#5eead4"/>

    <!-- Freight-route inspired diagram; decorative, not a deployment blueprint. -->
    <text class="mono" x="670" y="217" fill="#a5b6cb" font-size="11" letter-spacing="1.8">THE WHOLE JOURNEY</text>
    <path d="M746 277H909V362H1073V277" fill="none" stroke="#29425a" stroke-width="2" stroke-linejoin="round"/>
    <path class="signal" d="M746 277H909V362H1073V277" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26 614"/>

    <g transform="translate(670 242)">
      <rect width="152" height="76" rx="12" fill="#101d2e" stroke="#29425a"/>
      <rect x="14" y="16" width="23" height="19" rx="3" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <path d="M14 22H37M22 22V35" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <text class="sans" x="48" y="30" fill="#f0f5fb" font-size="15" font-weight="650">Interfaces</text>
      <text class="mono" x="14" y="57" fill="#a5b6cb" font-size="11">React / TypeScript</text>
    </g>
    <g transform="translate(833 327)">
      <rect width="152" height="76" rx="12" fill="#101d2e" stroke="#29425a"/>
      <path d="M22 15L15 23L22 31M30 15L37 23L30 31" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="sans" x="48" y="29" fill="#f0f5fb" font-size="15" font-weight="650">APIs &amp; data</text>
      <text class="mono" x="14" y="57" fill="#a5b6cb" font-size="11">Node.js / SQL</text>
    </g>
    <g transform="translate(997 242)">
      <rect width="152" height="76" rx="12" fill="#101d2e" stroke="#29425a"/>
      <path d="M17 32H33A5 5 0 0 0 34 22A8 8 0 0 0 19 22A5 5 0 0 0 17 32Z" fill="none" stroke="#ffb86b" stroke-width="1.5"/>
      <text class="sans" x="48" y="30" fill="#f0f5fb" font-size="15" font-weight="650">Cloud</text>
      <text class="mono" x="14" y="57" fill="#a5b6cb" font-size="11">AWS / Terraform</text>
    </g>
    <circle class="beacon" cx="825" cy="277" r="4" fill="#5eead4"/>
    <circle class="beacon" cx="989" cy="362" r="4" fill="#ffb86b"/>
    <text class="mono" x="1150" y="440" text-anchor="end" fill="#a5b6cb" font-size="11" letter-spacing="1">DESIGN → BUILD → SHIP → IMPROVE</text>
  </g>
  <rect x="1" y="1" width="1198" height="478" rx="24" fill="none" stroke="#29425a"/>
</svg>
